:root{

:root[data-theme="dark"]{

body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--body)}
.wrap{max-width:860px;margin:0 auto;padding-inline:20px;padding-block:40px 96px;display:flex;flex-direction:column;gap:40px}
header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font:800 34px/1.15 var(--body);margin:0;text-wrap:balance}
h2{font:700 22px/1.25 var(--body);margin:0;text-wrap:balance}
h3{font:700 15px/1.3 var(--body);margin:0}

.lede{color:var(--muted);font-size:16px}
section{display:flex;flex-direction:column;gap:14px}

ol.steps>li>div{min-width:0;display:flex;flex-direction:column;gap:8px}

.btn.ghost{background:transparent;color:var(--accent)}

.lists .card{gap:8px;padding:12px 14px}

.ed{display:flex;flex-direction:column;gap:4px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.bar .msg{font-size:13px;color:var(--muted)}
.bar .msg.bad{color:var(--danger);font-weight:600}
.rtable{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}

.rtable th,.rtable td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.rtable tr:last-child td{border-bottom:0}

<body>
<template id="tpl">
<div class="wrap">
<header>
  <div class="eyebrow">Bentonville Worship Gatherings · Planning Center Services</div>
  <h1>PCO Production Sheet</h1>
  <p class="lede">A bookmark that opens a dropdown grid on top of any plan in Planning Center. Pick an entry for Leader AM/PM, Audio, Lights, the three ProPresenter columns or Livestream, and it saves to the plan right away under your own login.</p>
  <p class="ver" data-ver=""></p>
</header>

<section id="install">
  <h2>Install (about a minute)</h2>
  <p class="hint">Works in Chrome, Safari, Firefox and Edge on a computer.</p>
  <ol class="steps">
    <li><div><h3>Show your bookmarks bar</h3><p>Press <code>Cmd+Shift+B</code> on a Mac or <code>Ctrl+Shift+B</code> on Windows. In Safari this is called the Favorites bar.</p></div></li>
    <li><div>
      <h3>Drag this button onto the bar</h3>
      <div class="card">
        <div class="row"><a class="btn drag" data-drag="" href="#">Production Sheet</a><span class="hint" data-draghint="" aria-live="polite">Click and hold the button, drag it up to your bookmarks bar, and let go.</span></div>
        <p class="hint">If the button won't drag into your bar, use one of the <a href="#other">other ways to add it</a> at the bottom of this page.</p>
      </div>
    </div></li>
    <li><div><h3>Open a plan and click it</h3><p>Go to any plan in Planning Center Services, then click <b>Production Sheet</b> in your bookmarks bar. You need to be signed in to Planning Center.</p></div></li>
  </ol>
  <p class="hint"><span class="warn">When the version changes:</span> the panel shows its version in the top corner. If yours is lower than the version at the top of this page, delete your old bookmark and add it again from here.</p>
</section>

<details id="use" class="tog">
  <summary><h2>How To Use It</h2></summary>
  <div class="uses">
    <div class="card"><h3>Pick from the list</h3><p>Every cell is a dropdown. Choosing an entry saves it to Planning Center immediately. There's no Save button.</p></div>
    <div class="card"><h3>Hover to focus</h3><p>Point at any cell and its row and column stay bright while the rest of the grid fades back.</p></div>
    <div class="card"><h3>Custom entry</h3><p>Choose <b>Custom…</b> at the bottom of a dropdown, type the entry and press Enter. It saves to this plan only and doesn't change the approved list.</p></div>
    <div class="card"><h3>Leader names</h3><p>The Leader dropdowns list people scheduled on that plan under BAND &gt; Vocals or on the LEADER team, followed by the Leader entries below. People who declined are left out.</p></div>
    <div class="card"><h3>Suggestions</h3><p>Suggestions are on when the sheet opens. Click <b>Suggestions</b> to hide or show them. A <span style="color:#1d5aa6;font-weight:600">blue</span> tag offers an entry for an empty cell. An <span style="color:#94560a;font-weight:600">orange</span> tag means what's there differs from the suggestion, like a typo, a duplicate or something left from an old template. Click a tag to use it. Nothing changes until you click.</p></div>
    <div class="card"><h3>Intentional entries</h3><p>If an entry is off the approved list or differs from the suggestion on purpose, click the <span style="color:#1e7b34;font-weight:700">✓ Intentional</span> tag under it, or choose <b>Mark intentional</b> in its dropdown. It turns <span style="color:#1e7b34;font-weight:700">green and bold</span> and stops being flagged orange. In Planning Center the note shows with two asterisks in front, like <code>** 1 BP + 1 HH</code>. Typing <code>**</code> at the start of a Custom entry marks it too. Picking a different entry clears the mark. Choose <b>Unmark intentional</b> to undo it.</p></div>
    <div class="card"><h3>Dashes</h3><p>A dash means "no change from the item above." Suggestions follow this, so the first song gets "Band" and the song after it gets "-".</p></div>
    <div class="card"><h3>Pre-fill</h3><p>Click <b>Pre-fill</b> to fill empty cells with their suggestion, or "-" if there isn't one. Cells that already have text are never changed. Cells with more than one suggestion stay empty for you to pick.</p></div>
    <div class="card"><h3>Hide headers</h3><p>Tick <b>Hide headers</b> at the top to hide the section header rows and see only the items.</p></div>
    <div class="card"><h3>Done</h3><p>Click <b>Done</b> or press Esc to close. The plan page reloads so it shows your changes.</p></div>
    <div class="card"><h3>Permissions</h3><p>The panel can only change what your Planning Center account can edit. If a cell turns red, hover over it to see why.</p></div>
  </div>
</details>

<details id="lists" class="tog">
  <summary><h2>Approved lists</h2></summary>
  <div class="sechead"><span></span><button class="btn ghost" type="button" data-edit="" hidden="">Edit lists</button></div>
  <p class="hint" data-listhint="">These are the entries in each dropdown, in the order they appear.</p>
  <div class="lists" data-lists=""></div>
</details>

<details id="suggestions" class="tog">
  <summary><h2>Suggestions</h2></summary>
  <div class="sechead"><span></span><button class="btn ghost" type="button" data-edit2="" hidden="">Edit suggestions</button></div>
  <p class="hint" data-sughint="">What the Suggestions and Pre-fill buttons offer for each kind of item. For each column, the first matching rule with a value is used. A blank cell means no suggestion, so Pre-fill puts "-" there. If a suggestion is the same as the entry above it, the tool suggests "-" instead.</p>
  <div class="rtable" data-rules=""></div>
</details>

<details id="changes" class="tog">
  <summary><h2>Changelog</h2></summary>
  <div class="clog" data-changelog=""></div>
</details>

<section id="other">
  <h2>Other ways to add the bookmark</h2>
  <p>Use these if dragging the button doesn't work. Each one starts by copying the bookmark code.</p>
  <div class="card">
    <div class="row"><button class="btn" data-copy="" type="button">Copy bookmark code</button><span class="hint" data-copied="" aria-live="polite"></span></div>
    <textarea data-code="" readonly="" aria-label="Bookmark code"></textarea>
  </div>
  <div class="uses">
    <div class="card"><h3>Chrome</h3><ol class="alt">
      <li>Click <b>Bookmarks</b>, then <b>Bookmark Manager</b>.</li>
      <li>Click the three vertical dots in the upper right corner.</li>
      <li>Click <b>Add new bookmark</b>.</li>
      <li>Name it <b>Production Sheet</b> and paste the code into the URL field.</li>
      <li>Click <b>Save</b>.</li>
    </ol></div>
    <div class="card"><h3>Safari</h3><ol class="alt">
      <li>Open any page and press <code>Cmd+D</code>. Choose <b>Favorites</b> and click <b>Add</b>.</li>
      <li>Click <b>Bookmarks</b>, then <b>Edit Bookmarks</b>.</li>
      <li>Right-click the new bookmark, choose <b>Edit Address</b> and paste the code.</li>
      <li>Right-click it again, choose <b>Rename</b> and name it <b>Production Sheet</b>.</li>
    </ol></div>
    <div class="card"><h3>Firefox</h3><ol class="alt">
      <li>Right-click the bookmarks toolbar and choose <b>Add Bookmark…</b></li>
      <li>Name it <b>Production Sheet</b>.</li>
      <li>Paste the code into the URL field.</li>
      <li>Click <b>Save</b>.</li>
    </ol></div>
  </div>
</section>

<footer>The panel uses the same connection the Planning Center website uses. If Planning Center changes that, the panel may stop loading until it's updated.</footer>
</div>
<div class="bar" data-bar="" hidden="">
  <span class="msg" data-barmsg="">Saving publishes a new version. Everyone will need to add the bookmark again to get it.</span>
  <button class="btn ghost" type="button" data-cancel="">Cancel</button>
  <button class="btn" type="button" data-save="">Save and publish</button>
</div>
</template>

      html += '<option disabled>────────</option><option value="' + CUSTOM + '">Custom…</option>' + (v !== null ? '<option value="' + CLEAR + '">Clear</option>' + (isInt() ? '<option value="' + UNINTENT + '">Unmark intentional</option>' : '<option value="' + INTENT + '">\u2713 Mark intentional</option>') : '');
      sel.innerHTML = html;
      sel.value = v === null ? NONE : v;
      sel.onchange = function () {
        if (sel.value === CUSTOM) { drawInput(); return; }
        if (sel.value === NONE) return;
        if (sel.value === INTENT || sel.value === UNINTENT) { save(v, sel.value === INTENT); return; }
        save(sel.value === CLEAR ? null : sel.value);
      };
      wrap.appendChild(sel);
    }
    function drawInput() {
      wrap.innerHTML = '';
      var inp = document.createElement('input'); inp.value = cur() || ''; inp.placeholder = 'Type, then Enter';
      var back = document.createElement('button'); back.className = 'x'; back.textContent = '↩'; back.title = 'Back to the list';
      var done = false;
      function commit() { if (done) return; done = true; var t = inp.value.trim(); if (t && t !== cur()) save(t); else drawSelect(); }
      inp.onkeydown = function (e) { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { e.stopPropagation(); done = true; drawSelect(); } };
      inp.onblur = function () { setTimeout(commit, 120); };
      back.onmousedown = function (e) { e.preventDefault(); done = true; drawSelect(); };
      wrap.appendChild(inp); wrap.appendChild(back); inp.focus(); inp.select();
    }
    async function save(val, intent) {
      if (val !== null && val.indexOf(MARK) === 0) { val = val.slice(MARK.length).trim(); intent = true; }
      intent = !!intent && val !== null;
      var prev = it.notes[cat] ? { id: it.notes[cat].id, content: it.notes[cat].content, intent: !!it.notes[cat].intent } : null;
      if (prev && val === prev.content && intent === prev.intent) { drawSelect(); return; }
      var body = val === null ? null : (intent ? MARK + ' ' : '') + val;
      var base = '/service_types/' + ST + '/plans/' + planId + '/items/' + it.id + '/item_notes';
      if (val === null) delete it.notes[cat]; else it.notes[cat] = { id: prev && prev.id, content: val, intent: intent };
      drawSelect(); paint('sv'); pending++; setStat();
      try {
        if (val === null) await api(base + '/' + prev.id, { method: 'DELETE' });
        else if (prev) await api(base + '/' + prev.id, { method: 'PATCH', body: { data: { type: 'ItemNote', id: prev.id, attributes: { content: body } } } });
        else { var res = await api(base, { method: 'POST', body: { data: { type: 'ItemNote', attributes: { content: body, item_note_category_id: cats[cat] } } } }); it.notes[cat].id = res.data.id; }
        saves++; paint('ok'); setTimeout(function () { if (td.classList.contains('ok')) paint(); }, 1500);
        refreshChips();
      } catch (e) {
        if (prev) it.notes[cat] = prev; else delete it.notes[cat];
        drawSelect(); paint('er'); failed++;
        td.title = (e.status === 401 || e.status === 403) ? 'You don’t have permission to edit this plan.' : 'Couldn’t save (' + e.message + '). Try again.';
      }
      pending--; setStat();
    }
    drawSelect(); paint();
    CELLS.push({ it: it, cat: cat, empty: function () { return cur() === null; }, save: save, chips: drawChips });
  }

  load();
})();
</script>
<script id="main">
(function(){
  var app=document.getElementById('app');
  app.appendChild(document.getElementById('tpl').content.cloneNode(true));
  var q=function(s){return app.querySelector(s);};
var state=JSON.parse(document.getElementById('state').textContent);
  state.rules=state.rules||[];
  var COLS=['Leader AM','Leader PM','Audio','Lights','PP: Audience','PP: Stage Layout','PP: Timers','Livestream'];
  var TOKENS={'@song_leader':'Song leader (from the song)','@vocals_am':'Vocals, AM services','@vocals_pm':'Vocals, PM service','@teacher_am':'Teacher, AM services','@teacher_pm':'Teacher, PM service','@host_am':'Host, AM services','@host_pm':'Host, PM service'};
  var POS={any:'',top:'at the top of the plan',bottom:'at the bottom of the plan'};
  var editing=null, artifactNs=null;

  function fmtDate(d){try{return new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});}catch(e){return d;}}
  function bookmarklet(st){
    var src=document.getElementById('panel-src').textContent.replace(/\/\*[\s\S]*?\*\//g,'');
    src=src.replace('__LISTS__',function(){return JSON.stringify(st.lists);}).replace('__LISTVER__',String(st.version)).replace('__RULES__',function(){return JSON.stringify(st.rules||[]);});
    src=src.split('\n').map(function(l){return l.trim();}).filter(Boolean).join('\n');
    return 'javascript:'+encodeURIComponent(src);
  }
  var BM=bookmarklet(state);
  q('[data-ver]').innerHTML='Current version: <b>v1.'+state.version+'</b>, updated '+fmtDate(state.updated);
  q('[data-code]').value=BM;
  var dl=q('[data-drag]'); dl.setAttribute('href',BM);
  dl.addEventListener('click',function(e){e.preventDefault();q('[data-draghint]').textContent='Drag this button to your bookmarks bar instead of clicking it.';});
  q('[data-copy]').addEventListener('click',function(){
    var ta=q('[data-code]'), msg=q('[data-copied]');
    function fb(){ta.focus();ta.select();msg.textContent='Press Cmd+C (or Ctrl+C) to copy the selected code.';}
    try{navigator.clipboard.writeText(BM).then(function(){msg.textContent='Copied. Paste it into the bookmark’s URL field.';},fb);}catch(e){fb();}
  });

  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
  function ib(txt,label,dis,fn,cls){var b=el('button','ib'+(cls?' '+cls:''),txt);b.type='button';b.title=label;b.setAttribute('aria-label',label);b.disabled=dis;b.addEventListener('click',fn);return b;}

  /* ---------- Changelog ---------- */
  function renderChangelog(){
    var wrap=q('[data-changelog]'); wrap.innerHTML='';
    var log=state.changelog||[];
    if(!log.length){wrap.appendChild(el('p','hint','No changes recorded yet.'));return;}
    log.forEach(function(e){
      var c=el('div','card'); var h=el('h3',null,'v1.'+e.version); h.appendChild(el('small',null,fmtDate(e.date))); c.appendChild(h);
      var ul=el('ul'); (e.changes||[]).forEach(function(t){ul.appendChild(el('li',null,t));}); c.appendChild(ul); wrap.appendChild(c);
    });
  }
  function describeChanges(lists,rules){
    var out=[];
    COLS.forEach(function(c){
      var a=state.lists[c]||[], b=lists[c]||[];
      var rem=a.filter(function(x){return b.indexOf(x)<0;}), add=b.filter(function(x){return a.indexOf(x)<0;});
      if(rem.length||add.length) out.push(c+' list: '+[add.length?'added '+add.join(', '):'',rem.length?'removed '+rem.join(', '):''].filter(Boolean).join('; ')+'.');
      else if(a.join('\n')!==b.join('\n')) out.push(c+' list reordered.');
    });
    if(JSON.stringify(rules)!==JSON.stringify(state.rules)) out.push('Suggestions updated.');
    return out.length?out:['Lists saved with no changes.'];
  }

  /* ---------- Approved lists ---------- */
  function renderListsView(){
    var wrap=q('[data-lists]'); wrap.innerHTML='';
    COLS.forEach(function(col){
      var c=el('div','card'); c.appendChild(el('h3',null,col));
      var ol=el('ol');
      (state.lists[col]||[]).forEach(function(v){ol.appendChild(el('li',null,v));});
      c.appendChild(ol); wrap.appendChild(c);
    });
  }
  function renderListsEdit(){
    var wrap=q('[data-lists]'); wrap.innerHTML='';
    COLS.forEach(function(col){
      var list=editing.lists[col];
      var c=el('div','card'); c.appendChild(el('h3',null,col));
      var ed=el('div','ed');
      list.forEach(function(v,i){
        var r=el('div','er');
        var inp=el('input'); inp.value=v; inp.id='e-'+COLS.indexOf(col)+'-'+i; inp.setAttribute('aria-label',col+' entry '+(i+1));
        inp.addEventListener('input',function(){list[i]=inp.value;});
        inp.addEventListener('change',function(){renderRulesEdit();});
        r.appendChild(inp);
        r.appendChild(ib('↑','Move up',i===0,function(){var t=list[i-1];list[i-1]=list[i];list[i]=t;renderListsEdit();renderRulesEdit();focusRow(col,i-1);}));
        r.appendChild(ib('↓','Move down',i===list.length-1,function(){var t=list[i+1];list[i+1]=list[i];list[i]=t;renderListsEdit();renderRulesEdit();focusRow(col,i+1);}));
        r.appendChild(ib('✕','Remove',false,function(){list.splice(i,1);renderListsEdit();renderRulesEdit();},'del'));
        ed.appendChild(r);
      });
      c.appendChild(ed);
      var add=el('button','btn ghost sm','+ Add entry'); add.type='button';
      add.addEventListener('click',function(){list.push('');renderListsEdit();var e=document.getElementById('e-'+COLS.indexOf(col)+'-'+(list.length-1));if(e)e.focus();});
      c.appendChild(add); wrap.appendChild(c);
    });
  }
  function focusRow(col,i){var e=document.getElementById('e-'+COLS.indexOf(col)+'-'+i);if(e)e.focus();}

  /* ---------- Suggestions ---------- */
  function whenText(r){return r.kind==='song'?'Any song':r.kind==='first'?'First item in the service':'Title starts with “'+(r.text||'')+'”';}
  function renderRulesView(){
    var wrap=q('[data-rules]'); wrap.innerHTML='';
    var t=el('table'); var hr=el('tr'); hr.appendChild(el('th',null,'When the item is'));
    COLS.forEach(function(c){hr.appendChild(el('th',null,c));});
    var th=el('thead'); th.appendChild(hr); t.appendChild(th);
    var tb=el('tbody');
    state.rules.forEach(function(r){
      var tr=el('tr'); var w=el('td','when',whenText(r)); if(POS[r.pos]) w.appendChild(el('small',null,POS[r.pos])); tr.appendChild(w);
      COLS.forEach(function(c){
        var td=el('td'); var box=el('div','rv'); var vals=(r.v||{})[c]||[];
        if(!vals.length) box.appendChild(el('span','none','—'));
        vals.forEach(function(v,i){
          var lab=TOKENS[v]?TOKENS[v]:v; var cls=TOKENS[v]?'tok':((state.lists[c]||[]).indexOf(v)<0?'orph':'');
          var sp=el('span',cls,(i?'or ':'')+lab); if(cls==='orph') sp.title='Not on the approved list'; box.appendChild(sp);
        });
        td.appendChild(box); tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t);
  }
  function valueSelect(col,cur,onch){
    var s=el('select'); s.setAttribute('aria-label',col+' suggestion');
    var html='<option value="">— none —</option>';
    var list=(editing?editing.lists[col]:state.lists[col])||[];
    var known=list.indexOf(cur)>=0||TOKENS[cur];
    if(cur&&!known) html+='<option value="'+attr(cur)+'">⚠ '+attr(cur)+'</option>';
    if(/^Leader/.test(col)) html+='<optgroup label="From the schedule">'+Object.keys(TOKENS).map(function(k){return '<option value="'+k+'">'+attr(TOKENS[k])+'</option>';}).join('')+'</optgroup><optgroup label="Approved list">';
    html+=list.filter(function(x){return x.trim();}).map(function(x){return '<option value="'+attr(x)+'">'+attr(x)+'</option>';}).join('');
    if(/^Leader/.test(col)) html+='</optgroup>';
    s.innerHTML=html; s.value=cur||''; s.addEventListener('change',function(){onch(s.value);}); return s;
  }
  function attr(x){return String(x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
  function renderRulesEdit(){
    if(!editing) return;
    var wrap=q('[data-rules]'); wrap.innerHTML='';
    var t=el('table'); var hr=el('tr'); hr.appendChild(el('th',null,'When the item is'));
    COLS.forEach(function(c){hr.appendChild(el('th',null,c));});
    var th=el('thead'); th.appendChild(hr); t.appendChild(th);
    var tb=el('tbody'); var rules=editing.rules;
    rules.forEach(function(r,ri){
      var tr=el('tr'); var td=el('td'); var wh=el('div','wh');
      var kind=el('select'); kind.innerHTML='<option value="first">First item in the service</option><option value="song">Any song</option><option value="title">Title starts with…</option>'; kind.value=r.kind;
      kind.setAttribute('aria-label','Rule '+(ri+1)+' type');
      kind.addEventListener('change',function(){r.kind=kind.value;renderRulesEdit();});
      wh.appendChild(kind);
      if(r.kind==='title'){
        var tx=el('input'); tx.value=r.text||''; tx.placeholder='e.g. TEACHING'; tx.setAttribute('aria-label','Rule '+(ri+1)+' title');
        tx.addEventListener('input',function(){r.text=tx.value;}); wh.appendChild(tx);
        var ps=el('select'); ps.innerHTML='<option value="any">Anywhere in the plan</option><option value="top">At the top of the plan</option><option value="bottom">At the bottom of the plan</option>'; ps.value=r.pos||'any';
        ps.setAttribute('aria-label','Rule '+(ri+1)+' position');
        ps.addEventListener('change',function(){r.pos=ps.value;}); wh.appendChild(ps);
      }
      var ctl=el('div','row');
      ctl.appendChild(ib('↑','Move rule up',ri===0,function(){var x=rules[ri-1];rules[ri-1]=r;rules[ri]=x;renderRulesEdit();}));
      ctl.appendChild(ib('↓','Move rule down',ri===rules.length-1,function(){var x=rules[ri+1];rules[ri+1]=r;rules[ri]=x;renderRulesEdit();}));
      ctl.appendChild(ib('✕','Remove rule',false,function(){rules.splice(ri,1);renderRulesEdit();},'del'));
      wh.appendChild(ctl); td.appendChild(wh); tr.appendChild(td);
      COLS.forEach(function(c){
        var cell=el('td'); r.v=r.v||{}; var vals=r.v[c]=r.v[c]||[];
        if(!vals.length) vals.push('');
        vals.forEach(function(v,vi){
          var row=el('div','vr');
          row.appendChild(valueSelect(c,v,function(nv){vals[vi]=nv;}));
          if(vi>0) row.appendChild(ib('✕','Remove this option',false,function(){vals.splice(vi,1);renderRulesEdit();},'del'));
          cell.appendChild(row);
        });
        var or=el('button','lnk','+ or'); or.type='button'; or.title='Offer another option for this column';
        or.addEventListener('click',function(){vals.push('');renderRulesEdit();});
        cell.appendChild(or); tr.appendChild(cell);
      });
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t);
    var add=el('button','btn ghost sm','+ Add rule'); add.type='button'; add.style.margin='10px';
    add.addEventListener('click',function(){rules.push({kind:'title',text:'',pos:'any',v:{}});renderRulesEdit();});
    wrap.appendChild(add);
  }

  /* ---------- Edit mode (lists and suggestions save together) ---------- */
  var editBtns=['[data-edit]','[data-edit2]'];
  function startEdit(){
    editing={lists:{},rules:JSON.parse(JSON.stringify(state.rules))};
    COLS.forEach(function(c){editing.lists[c]=(state.lists[c]||[]).slice();});
    editBtns.forEach(function(s){q(s).hidden=true;}); q('[data-bar]').hidden=false;
    q('[data-listhint]').textContent='Edit, reorder, add or remove entries. Changes aren’t shared until you save.';
    q('#lists').open=true; q('#suggestions').open=true;
    renderListsEdit(); renderRulesEdit();
  }
  function stopEdit(){
    editing=null; editBtns.forEach(function(s){q(s).hidden=false;}); q('[data-bar]').hidden=true;
    q('[data-listhint]').textContent='These are the entries in each dropdown, in the order they appear.';
    var m=q('[data-barmsg]'); m.className='msg'; m.textContent='Saving publishes a new version. Everyone will need to add the bookmark again to get it.';
    renderListsView(); renderRulesView();
  }
  function esc(s){return s.replace(/</g,'\\u003c');}
  function buildDoc(newState){
    var g=function(id){return document.getElementById(id).outerHTML;};
    var o='<', skel=o+'!doctype html>'+o+'html>'+o+'head>'+o+'meta charset=utf8>'+o+'meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">'+o+'style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}'+o+'/style>'+o+'/head>'+o+'body>\n';
    return skel+
      '<title>Production Sheet</title>\n'+g('f1')+'\n'+g('f2')+'\n'+g('st')+'\n'+g('tpl')+'\n<div id="app"></div>\n'+
      '<script type="application/json" id="state">'+esc(JSON.stringify(newState))+'<\/script>\n'+
      g('panel-src')+'\n'+g('main')+'</body></html>';
  }
  async function save(){
    var clean={}, total=0;
    COLS.forEach(function(c){var seen={};clean[c]=editing.lists[c].map(function(v){return v.trim();}).filter(function(v){if(!v||seen[v.toLowerCase()])return false;seen[v.toLowerCase()]=1;return true;});total+=clean[c].length;});
    var m=q('[data-barmsg]');
    if(!total){m.className='msg bad';m.textContent='Every list is empty. Add entries before saving.';return;}
    var rules=editing.rules.filter(function(r){return r.kind!=='title'||(r.text||'').trim();}).map(function(r){
      var v={}; COLS.forEach(function(c){var a=((r.v||{})[c]||[]).filter(function(x,i,arr){return x&&arr.indexOf(x)===i;}); if(a.length) v[c]=a;});
      return r.kind!=='title'?{kind:r.kind,text:'',pos:'any',v:v}:{kind:'title',text:r.text.trim(),pos:r.pos||'any',v:v};
    });
    var d=new Date(), pad=function(n){return(n<10?'0':'')+n;};
    var day=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    var log=[{version:state.version+1,date:day,changes:describeChanges(clean,rules)}].concat(state.changelog||[]);
    var ns={version:state.version+1,updated:day,lists:clean,rules:rules,changelog:log};
    var sb=q('[data-save]'); sb.disabled=true; m.className='msg'; m.textContent='Publishing…';
    try{ await artifactNs.publish(buildDoc(ns)); }
    catch(e){
      sb.disabled=false; m.className='msg bad';
      var code=e&&e.code;
      m.textContent=code==='not_writer'||code==='not_granted'?'Only editors of this page can make changes.':code==='conflict'?'Someone else just saved. The page will reload with their version.':'Couldn’t publish ('+(code||(e&&e.message)||'unknown error')+'). Try again.';
      try{console.error('publish failed',e);}catch(_){}
    }
  }
  q('[data-edit]').addEventListener('click',startEdit);
  q('[data-edit2]').addEventListener('click',function(){startEdit();});
  q('[data-cancel]').addEventListener('click',stopEdit);
  q('[data-save]').addEventListener('click',save);
  renderListsView(); renderRulesView(); renderChangelog();

  (async function(){
    try{
      if(!window.claude||!window.claude.use) return;
      var a=await window.claude.use('artifact'); if(!a) return;
      var u=await window.claude.use('user');
      var can=u?await u.canEdit():null;
      if(can===false) return;
      artifactNs=a; editBtns.forEach(function(s){q(s).hidden=false;});
    }catch(e){}
  })();
})();
</script>
